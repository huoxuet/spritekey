name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-png:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify public source inventory
        run: python scripts/verify_source.py
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1; subprocess.check_call([sys.executable,'-m','pip','install',wheels[0]])"
          python -m pip check
      - name: Test installed package (two external-video tests skipped)
        run: python -m unittest discover -s tests -v
      - name: Check installed payload and green/blue CLI demos
        run: python scripts/check_install.py
